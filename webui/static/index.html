<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>SunAgent</title>
<link rel="stylesheet" href="/static/style.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23c6ac8f'/></svg>">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="titlebar-left">
      <button class="icon-btn" id="btnSidebar" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="brand-name">SunAgent</span>
      </span>
    </div>

    <div class="titlebar-center">
      <span class="titlebar-title" id="sessionTitle">New conversation</span>
      <span class="status-badge" id="statusBadge" hidden></span>
    </div>

    <div class="titlebar-right">
      <span class="meta-chip" id="modelChip" title="Model and harness"></span>
      <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      </button>
      <button class="icon-btn primary" id="btnNewChat" title="New conversation (Ctrl+K)" aria-label="New conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-label">Conversations</span>
        <button class="icon-btn small" id="btnNewChatSide" title="New conversation" aria-label="New conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="sidebar-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="sessionSearch" type="search" placeholder="Filter conversations…" autocomplete="off" spellcheck="false">
      </div>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-foot">
        <button class="settings-trigger" id="btnSettings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="messages" id="messages">
        <div class="messages-inner" id="messagesInner">
          <div class="empty-state" id="emptyState">
            <div class="empty-mark">
              <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 3v5M16 24v5M3 16h5M24 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
            <h2>What should we work on?</h2>
            <p>SunAgent runs tools, reads files, and executes commands. Ask a question to get started.</p>
            <div class="suggestion-grid" id="suggestions"></div>
          </div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer-box" id="composerBox">
          <textarea id="msgInput" rows="1" placeholder="Message SunAgent…" spellcheck="false"></textarea>
          <div class="composer-footer">
            <div class="composer-left">
              <span class="composer-hint" id="composerHint">Enter sends · Shift+Enter adds a line</span>
            </div>
            <div class="composer-right">
              <button class="send-btn" id="btnSend" title="Send" aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-head">
        <h2 class="settings-title" id="settingsTitle">Settings</h2>
        <button class="icon-btn small" id="btnSettingsClose" title="Close" aria-label="Close settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <button class="settings-item" id="btnRestart" type="button">
          <svg class="settings-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span class="settings-item-text">
            <span class="settings-item-title">重启</span>
            <span class="settings-item-desc">在当前目录执行 ./run.sh restart</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="/static/markdown.js"></script>
<script src="/static/app.js?v=4"></script>
</body>
</html>
