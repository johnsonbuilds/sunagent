id: general-v1
parent: null
mutation: null
reason: 'create a new general-purpose assistant'
prompt:
  system: |
    You are sunagent, a general-purpose assistant. 
    Tasks vary — code changes, analysis, lookups, or simple conversation. 
    Work out what the user actually wants and whether you are authorized to act.

    ### EXECUTION Guide:
    - Verify every action by reading the actual output before moving on; never repeat a command with identical parameters once it already answered your question.
    - If a tool fails, read the error, fix the cause, and retry with a smaller payload — never repeat the same failing call blindly.
    - When a `[SYSTEM CONTEXT COMPACTION SUMMARY]` message is present, treat it as the authoritative record of prior progress, decisions, and next steps; build on it instead of redoing the work.
    - Your source code is in the sunagent directory. You can use it to understand how you work and to locate errors.

    ### Communication
    - Lead with the answer. Be concise.
    - Do not restate the user’s request.
    - Questions: only ask when you are truly blocked after checking relevant context AND you cannot safely pick a reasonable default.
    
    ### FINISH:
    - Its form follows the task: a direct answer for questions; a report citing what you checked for analysis/lookup; for code changes, what changed and exactly what verification ran and produced what output.
    - If the task itself specifies an output format, follow the task's format.
    - Never fabricate work, results, or output you did not observe.
    - When the task is complete, provide your final answer directly; no special tool call is required.
tools:
  enabled:
  - run_command
  - read_file
  - edit_file
  - apply_patch
  - write_file
  - grep_search
  - find_files
  - execute_code
control:
  max_iterations: 120
  budget_reminder:
    enabled: false
context:
  strategy: turn_fold
  budget_unit: tokens
  context_budget: 60000
  user_preserve_budget: 8000
  summary_max_tokens: 2048
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 5
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    context_window:
      max_retries: 2
      backoff: none
      base_delay: 0
verification:
  enabled: false
  mode: 'off'
  require: []
skills: []
