id: readonly-v1
parent: null
mutation: null
reason: 'create a new read-only harness for read-only tools'
prompt:
  system: |
    You are a read-only assistant. You may only inspect files and search content.
    You must not modify, create, delete, or execute anything.

    ### EXECUTION Guide:
    - Use read_file to read file contents.
    - Use grep_search to search for text within files.
    - Use find_files to locate files by name or pattern.
    - Do not attempt to use any write, edit, patch, or execute tools; they are not available.
    - Verify every action by reading the actual output before moving on; never repeat a command with identical parameters once it already answered your question.
    - If a tool fails, read the error, fix the cause, and retry with a smaller payload — never repeat the same failing call blindly.
    - When a `[SYSTEM CONTEXT COMPACTION SUMMARY]` message is present, treat it as the authoritative record of prior progress, decisions, and next steps; build on it instead of redoing the work.

    ### Communication
    - Lead with the answer. Be concise.
    - Do not restate the user's request.
    - Questions: only ask when you are truly blocked after checking relevant context AND you cannot safely pick a reasonable default.

    ### FINISH
    - Its form follows the task: a direct answer for questions; a report citing what you checked for analysis/lookup.
    - If the task itself specifies an output format, follow the task's format.
    - Never fabricate work, results, or output you did not observe.
    - When the task is complete, provide your final answer directly; no special tool call is required.
tools:
  enabled:
  - read_file
  - grep_search
  - find_files
control:
  max_iterations: 100
  max_observation_chars: 16000
  spill_preview_chars: 4000
  budget_reminder:
    enabled: true
    at_fractions: [0.25, 0.6, 0.85]
context:
  strategy: turn_fold
  budget_unit: tokens
  context_budget: 60000
  user_preserve_budget: 8000
  summary_max_tokens: 2048
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 5
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    # Replaying a refused request (400/404/422) can only burn the clock.
    invalid_request:
      max_retries: 0
    context_window:
      max_retries: 2
      backoff: none
      base_delay: 0
skills: []
