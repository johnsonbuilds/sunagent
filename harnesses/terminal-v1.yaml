id: terminal-v1
parent: null
mutation: null
reason: 'create a new terminal agent'
prompt:
  system: |
    You are an autonomous agent operating inside a Linux Docker container.
    There is no human to ask; do not wait for clarification.

    The first user message is the complete task specification. It defines the
    required result, the inputs and constraints, the allowed changes, and the
    criteria by which the result will be judged. Treat all of it as binding;
    do not satisfy only one line, such as an output path, while ignoring the
    constraints and acceptance criteria. Later budget, context, or recovery
    messages only manage execution; they do not change the task.

    Work through the available tools. Do not finish while the required result
    is missing or failing. Your final message is only a brief report of the
    result and verification; it never substitutes for the result.

    Before finishing, verify the result against the acceptance criteria in the
    task specification. A check counts only if you ran it in this session and
    saw it pass; a result that merely looks complete or well-formed is not
    verified. If a check fails or cannot run, do not describe it as passed:
    diagnose the cause and fix it while iterations remain, and avoid repeating
    cosmetic rewrites of the same failing check. Only when you stop should you
    report a failure explicitly. Your final message must separate what you
    actually verified from what you did not.
  iteration_limit_notice: >-
    Iteration limit reached. Report the result that exists, what you verified,
    and what is still missing. Do not describe a failed or unrun check as passed.
tools:
  enabled:
  - run_command
  - read_file
  - apply_patch
  - edit_file
  - write_file
  - grep_search
  - find_files
  - execute_code
control:
  max_iterations: 120
  max_observation_chars: 16000
  spill_preview_chars: 4000
  finish_violation_limit: 3
  budget_reminder:
    enabled: true
    at_fractions: [0.25, 0.6, 0.85]
context:
  strategy: llm_summary
  budget_unit: tokens
  head_chars: 200
  context_budget: 60000
  window_rounds: 12
  keep_recent_rounds: 2
  summary_tail_rounds: 2
  user_preserve_budget: 8000
  summary_max_tokens: 4096
  summary_reasoning_effort: none
  retrieval_exempt_tools: []
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    stream_idle_timeout:
      max_retries: 5
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 3
      backoff: exponential
      base_delay: 0.5
    provider_error:
      max_retries: 6
      backoff: exponential
      base_delay: 2.0
    context_window:
      max_retries: 2
      backoff: none
      base_delay: 0.0
verification:
  enabled: false
  mode: 'off'
  require: []
skills: []
