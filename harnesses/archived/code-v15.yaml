id: code-v15
parent: code-v14
mutation: 'control.budget_reminder gene (60%/85% close-loop nudge) + file-level command_to_verify gate + max_iterations 50->80'
reason: 'code-v14 63零分主因：52未提交耗尽预算、11窄-k假自信；加预算收口提醒并拒窄选命令'
prompt:
  system: ''
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - read_file
  - apply_patch
  - edit_file
  - write_file
  - grep_search
  - find_files
  - submit_result
control:
  max_iterations: 80
  finish_violation_limit: 3
  budget_reminder:
    enabled: true
    at_fractions: [0.6, 0.85]
memory:
  strategy: llm_summary
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 0
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
verification:
  enabled: true
  mode: task_result
  require:
  - solution_description
  - evidence
  - command_to_verify
skills:
- coder
