id: code-v14
parent: code-v13
mutation: 'prompt.system moved into skills/coder (mechanical move, no new strategy) + skills: []->[coder]'
reason: 'first skills-gene harness: code-v13 system prompt搬运为 skills/coder/SKILL.md 正文，prompt.system 置空，运行时经注入点A拼回同一条 system 消息；行为应对等，仅多一层 <skill> 包裹与 skills.loaded 溯源事件'
prompt:
  system: ''
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - read_file
  - apply_patch
  - edit_file
  - write_file
  - grep_search
  - find_files
  - submit_result
control:
  max_iterations: 50
  finish_violation_limit: 3
memory:
  strategy: llm_summary
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 0
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
verification:
  enabled: true
  mode: task_result
  require:
  - solution_description
  - evidence
  - command_to_verify
skills:
- coder
