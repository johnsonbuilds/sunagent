# Harness genome: describes HOW this agent works, as versioned data.
# The runtime engine stays stable; mutating this file (one gene at a
# time, with id/parent/mutation/reason recorded) is how harnesses evolve.

id: baseline-v0
parent: null
mutation: null
reason: extract current hardcoded behavior

prompt:
  # Empty on purpose: baseline-v0 never sends a system prompt.  Adding
  # one is reserved for a future prompt-gene mutation.
  system: ""
  iteration_limit_notice: >-
    Iteration limit reached. Summarize the progress and give the best
    possible final answer. Do not call tools.

tools:
  enabled:
    - run_command

control:
  max_iterations: 10

memory:
  strategy: full_history

recovery:
  # feed_error_and_continue: a failed tool call becomes an observation
  # ("Tool error: ...") and the loop continues with the next iteration.
  tool_error: feed_error_and_continue

verification:
  enabled: false

skills: []
