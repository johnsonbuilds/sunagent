id: code-v9
parent: code-v8
mutation: 'tools.enabled: glob_files->find_files'
reason: 'rename glob_files to find_files: old name implied standard glob semantics
  but ''*'' crosses separators and bare names match anywhere; new name states intent'
prompt:
  system: ''
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - read_file
  - apply_patch
  - edit_file
  - write_file
  - grep_search
  - find_files
control:
  max_iterations: 50
memory:
  strategy: llm_summary
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 0
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
verification:
  enabled: false
skills: []
