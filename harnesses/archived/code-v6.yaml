# Harness genome: describes HOW this agent works, as versioned data.
# The runtime engine stays stable; mutating this file (one gene at a
# time, with id/parent/mutation/reason recorded) is how harnesses evolve.

id: code-v6
parent: code-v4
mutation: control.max_iterations=50
reason: 'cap the straggler tail: 32/33 historical first-edits landed by iter 30, only
  sympy-92 needed more (impossible under the guard); halves the worst single-trial
  burn for large runs'
prompt:
  system: ''
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - read_file
  - apply_patch
  - edit_file
control:
  max_iterations: 50
  max_observation_chars: 16000
  spill_preview_chars: 4000
memory:
  strategy: llm_summary
  head_chars: 200
  context_budget: 60000
  window_rounds: 12
  keep_recent_rounds: 2
  summary_tail_rounds: 2
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 0
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
verification:
  enabled: false
skills: []

