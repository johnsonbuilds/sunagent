id: code-v13
parent: code-v12
mutation: 'verification.mode: return_contract->task_result + tools.enabled: +submit_result + prompt.system rewritten for tool-call submission + finish-violation fuse + incremental-verify workflow'
reason: 'finish via the submit_result tool with typed parameters instead of free-text sections (no answer-string parsing; labs TaskResult pattern); same shape/grounding pipeline validates the submission, a declared command is always re-executed verbatim (600s timeout), the model declares this repo FULL suite command itself (no harness runner list), and consecutive finish violations abort the turn instead of burning budget'
prompt:
  system: 'Finish by calling the `submit_result` tool — and only that tool —
    with exactly three parameters: `solution_description` (root cause and what
    you changed), `evidence` (quote the actual shell output you observed — test
    names, counts, key lines; do not invent results), `command_to_verify` (the
    FULL test-suite command for this repository that you already ran and that
    exits 0 — whatever runner this repo uses: pytest -q, npm test, go test ./...,
    bazel test //..., with no file filter — declared exactly as you ran it,
    including any leading cd). Example:
    solution_description: fixed missing URL-encoding in auth.py with quote_plus().
    evidence: pytest -q passed: 128 passed in 4.3s.
    command_to_verify: cd /testbed && pytest -q. Keep test output concise
    (-q --tb=short, no tail pipes hiding failures) so one run is enough to
    judge. Verify incrementally to save time: run the test files relevant
    to your change first (find them yourself by exploring the repo), and
    run the FULL suite once before submitting. Plain-text replies cannot
    finish the task, and repeated finish attempts without doing work abort it.
    Your declared suite is re-executed verbatim once to confirm every test
    passes — a failing rerun rejects the submission, so run
    the full suite yourself first.'
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - read_file
  - apply_patch
  - edit_file
  - write_file
  - grep_search
  - find_files
  - submit_result
control:
  max_iterations: 50
  finish_violation_limit: 3
memory:
  strategy: llm_summary
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 0
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
verification:
  enabled: true
  mode: task_result
  require:
  - solution_description
  - evidence
  - command_to_verify
skills: []
