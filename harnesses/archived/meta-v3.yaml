id: meta-v3
parent: meta-v2
mutation: clear system prompt
reason: tool schema already have tool description
prompt:
  system: ''
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - write_file
  - read_file
  - list_dir
  - edit_file
  - apply_patch
  - grep_search
  - glob_files
  - find_symbol
  - find_references
  - todo_write
  - execute_code
control:
  max_iterations: 50
memory:
  strategy: full_history
recovery:
  tool_error: feed_error_and_continue
verification:
  enabled: false
skills: []
