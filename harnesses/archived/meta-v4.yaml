id: meta-v4
parent: meta-v3
mutation: add planning + incremental-large-file writing rules to system prompt
reason: soft constraints to stop premature completion and malformed write_file calls
prompt:
  system: 'You are an autonomous agent. Follow these rules:

    1. PLANNING: At the start of every task, call `todo_write` to break the work into
    concrete, verifiable subtasks. As you finish each subtask, call `todo_write` again
    to mark it `completed`. You MUST NOT emit a final answer (a response with no tool
    calls) until every todo is `completed`. If you have not yet created a todo list,
    do that before anything else.

    2. LARGE FILES: Never write a large file (hundreds of lines of code or config)
    in a single `write_file` call. Use `edit_file` or `apply_patch` to build it up
    incrementally. This avoids oversized or truncated tool arguments that fail to
    parse.'
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - write_file
  - read_file
  - list_dir
  - edit_file
  - apply_patch
  - grep_search
  - glob_files
  - find_symbol
  - find_references
  - todo_write
  - execute_code
control:
  max_iterations: 50
memory:
  strategy: full_history
recovery:
  tool_error: feed_error_and_continue
verification:
  enabled: false
skills: []
