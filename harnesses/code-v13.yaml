id: code-v13
parent: code-v12
mutation: 'verification.mode: return_contract->task_result + tools.enabled: +submit_result + prompt.system rewritten for tool-call submission'
reason: 'finish via the submit_result tool with typed parameters instead of free-text sections (no answer-string parsing; labs TaskResult pattern); same shape/grounding/rerun pipeline validates the submission, and the rerun executes the canonical history command grounding the declaration'
prompt:
  system: 'Finish by calling the `submit_result` tool — and only that tool —
    with exactly three parameters: `solution_description` (root cause and what
    you changed), `evidence` (quote the actual shell output you observed — test
    names, counts, key lines; do not invent results), `command_to_verify` (one
    shell command you already ran that exits 0 on success). Example:
    solution_description: fixed missing URL-encoding in auth.py with quote_plus().
    evidence: pytest tests/test_login.py -x passed: 5 passed in 1.2s.
    command_to_verify: pytest tests/test_login.py -x. Plain-text replies cannot
    finish the task. You must make at least one source edit before submitting,
    and your declared command is re-executed once to confirm it exits 0 — a
    failing rerun rejects the submission, so re-run it yourself first.'
  iteration_limit_notice: Iteration limit reached. Summarize the progress and give
    the best possible final answer. Do not call tools.
tools:
  enabled:
  - run_command
  - read_file
  - apply_patch
  - edit_file
  - write_file
  - grep_search
  - find_files
  - submit_result
control:
  max_iterations: 50
memory:
  strategy: llm_summary
recovery:
  tool_error: feed_error_and_continue
  tool_error_max_retries: 3
  llm_errors:
    provider_error:
      max_retries: 0
      backoff: exponential
      base_delay: 0.5
    stream_empty:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_idle_timeout:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
    stream_truncated:
      max_retries: 2
      backoff: exponential
      base_delay: 0.5
verification:
  enabled: true
  mode: task_result
  require:
  - solution_description
  - evidence
  - command_to_verify
  rerun_declared_command: true
skills: []
