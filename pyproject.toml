[project]
name = "sunagent"
version = "0.1.0"
description = "Small, composable exercises for learning agent systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
agent-practice = "run_agent:main"
sunagent-webui = "webui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime", "webui"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
eval = [
    "harbor>=0.21.0",
]
